  <style>
    :root {
      --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #6b7385; --border: #e2e5eb;
      --accent: #0f8a6b; --accent-text: #ffffff; --user-bg: #0f8a6b; --bot-bg: #f0f2f6;
      --chip-bg: #e6f5f0; --chip-text: #0b6650; --error: #c0392b; --hover: #f2f4f7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11151a; --panel: #1a1f26; --text: #e6e9ef; --muted: #8d95a7; --border: #2a303c;
        --accent: #2fbf95; --accent-text: #0b1a15; --user-bg: #1d7a61; --bot-bg: #232834;
        --chip-bg: #183a31; --chip-text: #7fdcbd; --error: #ff7a6b; --hover: #222833;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
    .app { max-width: 1100px; margin: 0 auto; height: 100dvh; padding: 16px; display: grid;
           grid-template-columns: 280px 1fr; grid-template-rows: auto 1fr auto; gap: 12px 16px; }
    .who { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
    .wave { display: inline-block; transform-origin: 70% 70%; animation: wave 2.4s ease-in-out infinite; }
    @keyframes wave { 0%, 60%, 100% { transform: rotate(0); } 10%, 30% { transform: rotate(16deg); } 20%, 40% { transform: rotate(-8deg); } }
    .status { display: flex; align-items: center; gap: 10px; }
    .status .emoji { font-size: 16px; }
    .status .text { animation: fade-in .35s ease; }
    @keyframes fade-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .dots span { display: inline-block; width: 5px; height: 5px; margin-left: 3px; border-radius: 50%; background: var(--muted);
                 animation: blink 1.2s infinite; }
    .dots span:nth-child(2) { animation-delay: .2s; } .dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
    .avatar { display: inline-block; width: var(--size, 28px); height: var(--size, 28px); border-radius: 50%;
              overflow: hidden; flex: none; vertical-align: middle; box-shadow: 0 0 0 2px var(--border); }
    .avatar svg { display: block; width: 100%; height: 100%; }
    header h1 { display: flex; align-items: center; gap: 10px; }
    .who { display: flex; align-items: center; gap: 6px; }
    .status .avatar { animation: think 1.6s ease-in-out infinite; }
    @keyframes think { 0%, 100% { transform: translateY(0) rotate(0); } 25% { transform: translateY(-3px) rotate(-6deg); }
                       75% { transform: translateY(-3px) rotate(6deg); } }
    @media (prefers-reduced-motion: reduce) { .wave, .status .avatar, .status .text, .dots span { animation: none; } }
    footer { grid-column: 1 / -1; text-align: center; font-size: 13px; color: var(--muted); }
    footer a { color: var(--accent); text-decoration: none; font-weight: 600; }
    footer a:hover { text-decoration: underline; }
    header { grid-column: 1 / -1; }
    header h1 { margin: 0; font-size: 20px; }
    header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
    aside, main { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; min-height: 0; }
    aside { padding: 14px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
    aside h2 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    .doc { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 8px; border: 1px solid var(--border); }
    .doc .info { flex: 1; min-width: 0; }
    .doc .name { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .doc .meta { font-size: 12px; color: var(--muted); }
    .doc button { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 16px; padding: 2px 6px; border-radius: 6px; }
    .doc button:hover { background: var(--hover); color: var(--error); }
    .upload { display: block; text-align: center; padding: 10px; border: 1px dashed var(--border); border-radius: 8px;
              color: var(--muted); cursor: pointer; font-size: 14px; }
    .upload:hover { border-color: var(--accent); color: var(--text); }
    .upload input { display: none; }
    #upload-status { font-size: 13px; color: var(--muted); min-height: 1em; }
    main { display: flex; flex-direction: column; overflow: hidden; }
    #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 88%; padding: 10px 14px; border-radius: 12px; }
    .user { align-self: flex-end; background: var(--user-bg); color: #fff; white-space: pre-wrap; }
    .bot { align-self: flex-start; background: var(--bot-bg); }
    .error { align-self: flex-start; color: var(--error); font-size: 14px; }
    .answer p { margin: 0 0 6px; } .answer ul { margin: 0 0 6px; padding-left: 20px; }
    sup.cite { color: var(--chip-text); background: var(--chip-bg); border-radius: 4px; padding: 0 4px; font-size: 11px;
               cursor: pointer; margin-left: 1px; }
    .sources { margin-top: 8px; border-top: 1px solid var(--border); padding-top: 6px; font-size: 13px; }
    .sources details { margin: 4px 0; }
    .sources summary { cursor: pointer; color: var(--chip-text); }
    .sources blockquote { margin: 4px 0 6px; padding: 6px 10px; border-left: 3px solid var(--accent); color: var(--muted);
                          background: var(--panel); border-radius: 0 6px 6px 0; }
    .trace { font-size: 12px; color: var(--muted); margin-top: 6px; font-family: ui-monospace, monospace; }
    .suggestions { display: flex; flex-wrap: wrap; gap: 8px; }
    .suggestions button { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 999px;
                          padding: 6px 12px; cursor: pointer; font: inherit; font-size: 13px; }
    .suggestions button:hover { border-color: var(--accent); }
    form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); }
    input[type=text] { flex: 1; min-width: 0; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
                       background: var(--bg); color: var(--text); font: inherit; }
    input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    form button { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 10px; padding: 0 18px;
                  font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    @media (max-width: 760px) {
      .app { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr auto; height: auto; min-height: 100dvh; }
      main { min-height: 70dvh; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1><span data-avatar="40"></span> Akram · Document Research Agent</h1>
      <p>Upload PDFs or text files and ask questions. Every answer cites the passages it came from.</p>
    </header>
    <aside>
      <h2>Documents</h2>
      <div id="docs"></div>
      <label class="upload">+ Upload PDF, TXT or MD<input type="file" id="file" accept=".pdf,.txt,.md"></label>
      <div id="upload-status"></div>
    </aside>
    <main>
      <div id="log">
        <div class="msg bot"><div class="who"><span data-avatar="22"></span> Akram</div>Hi, I'm Akram <span class="wave">👋</span> Ask me anything about your documents. Two sample documents are loaded. Try:</div>
        <div class="suggestions">
          <button>How much is the meal allowance when travelling?</button>
          <button>Which CloudVault plan keeps backups for a year, and what does it cost?</button>
          <button>What happens to my data if I lose my private encryption key?</button>
          <button>What is the company's stock option policy?</button>
        </div>
      </div>
      <form id="form">
        <input type="text" id="input" placeholder="Ask a question about your documents…" autocomplete="off" maxlength="2000" required>
        <button type="submit">Ask</button>
      </form>
    </main>
    <footer>
      Built by <a href="https://www.linkedin.com/in/er-mohammad-akram/" target="_blank" rel="noopener">Mohammad Akram</a>
      · <a href="https://github.com/erakram/document-research-agent" target="_blank" rel="noopener">GitHub</a>
    </footer>
  </div>
  <template id="akram-avatar"><svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="120" height="120" fill="#f4efe4"/><g><path d="M14 124 Q16 96 60 94 Q104 96 106 124 Z" fill="#4f6e48"/><path d="M44 96 Q60 106 76 96 Q60 100 44 96 Z" fill="#3f5a3a"/><rect x="50" y="78" width="20" height="18" rx="6" fill="#e9b892"/><circle cx="32" cy="62" r="6.5" fill="#efbf9b"/><circle cx="88" cy="62" r="6.5" fill="#efbf9b"/><ellipse cx="60" cy="60" rx="27" ry="31" fill="#f6cfad"/><path d="M33 60 Q33 94 60 96 Q87 94 87 60 Q86 76 76 80 Q68 74 60 76 Q52 74 44 80 Q34 76 33 60 Z" fill="#7b4a2b"/><path d="M46 80 Q60 94 74 80 Q60 85 46 80 Z" fill="#ffffff" stroke="#5a3019" stroke-width="1.5" stroke-linejoin="round"/><path d="M57 63 Q60 71 63 63" fill="none" stroke="#d99b77" stroke-width="2" stroke-linecap="round"/><path d="M29 58 Q22 34 38 24 Q44 12 60 15 Q76 10 86 22 Q100 32 91 58 Q89 44 80 40 Q72 46 62 41 Q52 47 43 42 Q35 46 29 58 Z" fill="#8a5a2e"/><circle cx="36" cy="30" r="10" fill="#8a5a2e"/><circle cx="50" cy="19" r="11" fill="#8a5a2e"/><circle cx="66" cy="16" r="11" fill="#8a5a2e"/><circle cx="81" cy="24" r="10" fill="#8a5a2e"/><circle cx="89" cy="38" r="7" fill="#8a5a2e"/><circle cx="30" cy="42" r="7" fill="#8a5a2e"/><path d="M38 28 Q44 21 52 24 M56 16 Q64 11 72 16 M74 24 Q82 22 86 30 M46 35 Q55 29 64 34" fill="none" stroke="#a8743f" stroke-width="2.5" stroke-linecap="round"/><path d="M39 47 Q46 43 53 46 M67 46 Q74 43 81 47" fill="none" stroke="#6b3f22" stroke-width="3" stroke-linecap="round"/><circle cx="47" cy="57" r="5.5" fill="#ffffff"/><circle cx="73" cy="57" r="5.5" fill="#ffffff"/><circle cx="47.5" cy="57.5" r="3" fill="#3a2516"/><circle cx="72.5" cy="57.5" r="3" fill="#3a2516"/><circle cx="48.5" cy="56.3" r="1" fill="#ffffff"/><circle cx="73.5" cy="56.3" r="1" fill="#ffffff"/><rect x="36" y="48" width="22" height="18" rx="9" fill="none" stroke="#4a2e1c" stroke-width="3"/><rect x="62" y="48" width="22" height="18" rx="9" fill="none" stroke="#4a2e1c" stroke-width="3"/><path d="M58 55 Q60 53 62 55 M36 54 L31 52 M84 54 L89 52" fill="none" stroke="#4a2e1c" stroke-width="3" stroke-linecap="round"/></g></svg></template>
  <script>
    const $ = (id) => document.getElementById(id);
    const log = $("log"), input = $("input"), askBtn = $("form").querySelector("button");
    const history = [];

    const escapeHtml = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    // Safe Markdown subset (bold, code, bullets), with [S12] citations turned into numbered links.
    function renderAnswer(text, numbers) {
      const inline = (s) => s
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\s*\[(\s*S\d+\s*(?:[,;]\s*S\d+\s*)*)\]/g, (_, group) =>
          group.match(/S\d+/g).filter((id) => numbers[id])
            .map((id) => `<sup class="cite" data-id="${id}">${numbers[id]}</sup>`).join(""));
      let html = "", inList = false;
      for (const line of escapeHtml(text).split("\n")) {
        const item = line.match(/^\s*[-*•]\s+(.*)/);
        if (item) { if (!inList) { html += "<ul>"; inList = true; } html += `<li>${inline(item[1])}</li>`; continue; }
        if (inList) { html += "</ul>"; inList = false; }
        if (line.trim()) html += `<p>${inline(line)}</p>`;
      }
      return html + (inList ? "</ul>" : "");
    }

    function add(cls, text) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      if (text) div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      return div;
    }

    // While waiting for the answer, show what Akram is working on. The steps advance on a timer
    // (the API returns one response at the end) and stop at the last one.
    function showStatus(steps) {
      const bubble = add("bot", "");
      bubble.innerHTML = '<div class="status"><span data-avatar="30"></span><span class="emoji"></span><span class="text"></span><span class="dots"><span></span><span></span><span></span></span></div>';
      let i = 0;
      const show = () => {
        const [emoji, text] = steps[i];
        bubble.querySelector(".emoji").textContent = emoji;
        const label = bubble.querySelector(".text");
        label.textContent = text;
        label.style.animation = "none"; label.offsetWidth; label.style.animation = "";  // replay fade-in
      };
      fillAvatars(bubble);
      show();
      const timer = setInterval(() => { if (i < steps.length - 1) { i++; show(); } }, 1800);
      return { remove() { clearInterval(timer); bubble.remove(); } };
    }

    function whoLabel(bubble) {
      const who = document.createElement("div");
      who.className = "who";
      who.innerHTML = '<span data-avatar="22"></span> Akram';
      fillAvatars(who);
      bubble.prepend(who);
    }

    // Replace each <span data-avatar="size"> with Akram's avatar at that size.
    function fillAvatars(root = document) {
      root.querySelectorAll("[data-avatar]").forEach((el) => {
        const span = document.createElement("span");
        span.className = "avatar";
        span.style.setProperty("--size", el.dataset.avatar + "px");
        span.innerHTML = document.getElementById("akram-avatar").innerHTML;
        el.replaceWith(span);
      });
    }
    fillAvatars();

    async function loadDocs() {
      const docs = await (await fetch("/api/documents")).json();
      $("docs").innerHTML = docs.length ? "" : '<div class="doc"><div class="meta">No documents yet.</div></div>';
      for (const d of docs) {
        const row = document.createElement("div");
        row.className = "doc";
        row.innerHTML = `<div class="info"><div class="name"></div><div class="meta"></div></div><button title="Delete">✕</button>`;
        row.querySelector(".name").textContent = d.name;
        row.querySelector(".meta").textContent = `${d.pages ? d.pages + " pages · " : ""}${d.chunks} chunks`;
        row.querySelector("button").onclick = async () => {
          if (!confirm(`Delete ${d.name}?`)) return;
          await fetch(`/api/documents/${d.id}`, { method: "DELETE" });
          loadDocs();
        };
        $("docs").appendChild(row);
      }
    }

    $("file").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      $("upload-status").textContent = `Processing ${file.name}…`;
      const form = new FormData();
      form.append("file", file);
      try {
        const res = await fetch("/api/documents", { method: "POST", body: form });
        const data = await res.json();
        $("upload-status").textContent = res.ok ? `Added ${data.name} (${data.chunks} chunks).` : data.detail;
        loadDocs();
      } catch { $("upload-status").textContent = "Upload failed."; }
      e.target.value = "";
    });

    async function ask(question) {
      add("user", question);
      input.value = "";
      askBtn.disabled = true;
      const thinking = showStatus([
        ["🤔", "Akram is reading your question"],
        ["🔎", "Akram is searching your documents"],
        ["📑", "Akram is reading the passages"],
        ["🔗", "Akram is checking the citations"],
        ["✍️", "Akram is writing the answer"],
      ]);
      try {
        const res = await fetch("/api/ask", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question, history: history.slice(-20) }),
        });
        const data = await res.json();
        thinking.remove();
        if (!res.ok) { add("error", typeof data.detail === "string" ? data.detail : "Something went wrong."); return; }

        const numbers = {};
        data.citations.forEach((c, i) => (numbers[c.source_id] = i + 1));
        const bubble = add("bot");
        bubble.innerHTML = `<div class="answer">${renderAnswer(data.answer, numbers)}</div>`;
        whoLabel(bubble);

        if (data.citations.length) {
          const sources = document.createElement("div");
          sources.className = "sources";
          data.citations.forEach((c, i) => {
            const d = document.createElement("details");
            d.id = `src-${c.source_id}-${log.children.length}`;
            d.innerHTML = `<summary></summary><blockquote></blockquote>`;
            d.querySelector("summary").textContent = `[${i + 1}] ${c.document}${c.page ? ", page " + c.page : ""}`;
            d.querySelector("blockquote").textContent = c.text;
            d.dataset.id = c.source_id;
            sources.appendChild(d);
          });
          bubble.appendChild(sources);
          bubble.querySelectorAll("sup.cite").forEach((sup) => sup.onclick = () => {
            const d = sources.querySelector(`details[data-id="${sup.dataset.id}"]`);
            d.open = true; d.scrollIntoView({ block: "nearest", behavior: "smooth" });
          });
        }
        const trace = document.createElement("div");
        trace.className = "trace";
        const searches = data.tool_calls.filter((t) => t.name === "search_documents").map((t) => `"${t.arguments.query}"`);
        trace.textContent = `${searches.length ? "searched " + searches.join(", ") + " · " : ""}${data.latency_ms} ms`;
        bubble.appendChild(trace);
        history.push({ role: "user", content: question }, { role: "assistant", content: data.answer });
      } catch {
        thinking.remove();
        add("error", "Could not reach the server.");
      } finally {
        askBtn.disabled = false;
        input.focus();
      }
    }

    $("form").addEventListener("submit", (e) => { e.preventDefault(); if (input.value.trim()) ask(input.value.trim()); });
    document.querySelectorAll(".suggestions button").forEach((b) => b.addEventListener("click", () => ask(b.textContent)));
    loadDocs();
  </script>
</body>
</html>
